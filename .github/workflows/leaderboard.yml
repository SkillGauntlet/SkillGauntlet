# Regenerates LEADERBOARD.md after data lands on main.
#
# Runs only on pushes to main (merged, already-checked data) and by hand. It reads files and writes one
# file; no model call, no secret beyond the job token. The page is rebuilt from step0/data/ and
# submissions/ only, so a pull request cannot make it say anything the data does not.
#
# main requires the license/cla check, so the bot does not push there. It pushes the page to the branch
# bot/leaderboard and opens (or updates) one pull request for a maintainer to merge. This needs
# "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
name: leaderboard

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "step0/data/**"
      - "scripts/build-leaderboard.mjs"
      - "lib/submission.js"
      - "lib/schema.js"
      - "schemas/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-leaderboard.mjs
      - name: Open or update the leaderboard pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- LEADERBOARD.md; then
            echo "LEADERBOARD.md is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/leaderboard
          git add LEADERBOARD.md
          git commit -q -m "Regenerate LEADERBOARD.md"
          git push -f origin bot/leaderboard
          if [ -n "$(gh pr list --head bot/leaderboard --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open leaderboard pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head bot/leaderboard --title "Regenerate LEADERBOARD.md" --body "Rebuilt by the leaderboard workflow from \`step0/data/\` and \`submissions/\` on main (${GITHUB_SHA}). Generated file only; merge to publish."
            echo "Opened a leaderboard pull request." >> "$GITHUB_STEP_SUMMARY"
          fi
